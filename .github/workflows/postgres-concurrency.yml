name: PostgreSQL concurrency verification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  postgres-regressions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hodi_ci
          POSTGRES_USER: hodi_ci
          POSTGRES_PASSWORD: hodi_ci_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hodi_ci -d hodi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_ENV: development
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: hodi_ci
      DB_USER: hodi_ci
      DB_PASSWORD: hodi_ci_ephemeral_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install declared backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Wait for disposable PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME"; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to disposable CI database
        run: python manage.py migrate --noinput

      - name: Run Django system checks against PostgreSQL
        run: python manage.py check --database default

      - name: Run PostgreSQL lease overlap concurrency test
        shell: bash
        run: |
          set -o pipefail
          python manage.py test apps.leases.test_overlap_concurrency --verbosity 2 2>&1 | tee /tmp/hodi-postgres-concurrency.log
          if ! grep -Eq 'test_concurrent_overlapping_creates_allow_only_one_lease .*\.\.\. ok' /tmp/hodi-postgres-concurrency.log; then
            echo "The PostgreSQL concurrency test did not run and pass (it may have been skipped)." >&2
            exit 1
          fi

      - name: Run billing, maintenance and lease regressions
        run: >-
          python manage.py test
          apps.billing.test_mpesa_callback
          apps.billing.test_mpesa_reconciliation
          apps.billing.test_mpesa_client
          apps.billing.test_ledger
          apps.maintenance.test_requests
          apps.maintenance.tests
          apps.leases.tests
          apps.leases.test_lifecycle
          apps.leases.test_overlap_concurrency
